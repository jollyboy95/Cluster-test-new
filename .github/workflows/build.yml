name: Build ClusterProbe debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --warning-mode all 2>&1 | tee build_output.log

      - name: Surface build errors as annotations
        if: always()
        run: |
          if [ -f build_output.log ]; then
            grep -nE "error:|FAILURE|Exception|what went wrong|\* Where|\* What went wrong" build_output.log \
              | tail -n 60 \
              | while IFS= read -r line; do
                  safe=$(echo "$line" | sed 's/%/pct/g')
                  echo "::error::${safe}"
                done
          else
            echo "::error::build_output.log was not created - gradle may have failed before producing output."
          fi

      - name: Fail job if assemble failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClusterProbe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
