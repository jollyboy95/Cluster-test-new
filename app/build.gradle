plugins {
    id 'com.android.application'
    // v0.26: see root build.gradle's comment and docs/H7_DISPLAY_ARCHITECTURE.md.
    id 'com.google.protobuf'
}

android {
    namespace 'com.clusterprobe'
    compileSdk 33
    defaultConfig {
        applicationId "com.clusterprobe"
        minSdk 28
        targetSdk 28
        versionCode 30
        versionName "0.30"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // app/src/main/proto/*.proto is the DEFAULT source set location the protobuf Gradle plugin
    // already scans - no explicit sourceSets block needed. These files MUST stay flat directly
    // under proto/ (not nested in a subfolder): their own `import "Foo.proto";` statements are
    // same-directory relative (that's how they shipped in aasdk's own aasdk_proto/ directory), so
    // nesting them under e.g. proto/aasdk/ breaks protoc's import resolution (confirmed by the
    // v0.26 CI failure: "File not found" on every cross-file import). Those .proto files are
    // vendored verbatim, unmodified, from https://github.com/f1xpl/aasdk (commit 046b3b381595509d
    // 0939fa84b14a90978f46ff63), GPLv3, Copyright (c) 2018 f1x.studio (Michal Szwaj) - real Android
    // Auto protocol message definitions, used here only as a protocol SPEC (compiled to Java
    // message classes); none of aasdk's own C++ implementation is used or linked. See
    // docs/H7_DISPLAY_ARCHITECTURE.md for why (libusb/Boost/OpenSSL don't drop into a sandboxed
    // Android app, and this project has no way to build or test native/NDK code at all).
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.21.12'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}

dependencies {
    // Shizuku: lets this app run a shell-UID helper (GwmLogcatUserService) to read logcat tags
    // that belong to other processes - a normal app-UID process can't. Read-only; never used to
    // touch the signature-protected car.ipk_setting.* interface. See GwmLogcatVehicleDataSource.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // v0.26: runtime for the generated Java classes from app/src/main/proto/*.proto -
    // version must track the protoc artifact above.
    implementation 'com.google.protobuf:protobuf-java:3.21.12'
}
